name: Update Fish News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: pip install feedparser beautifulsoup4 requests

    - name: Run scraper
      run: python fish_news.py

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add fish_news.json

        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "Auto update news"
          git push
        fi
